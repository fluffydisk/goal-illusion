name: Check on-demand AI quality
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: Up to three comma-separated matches for private tests (does not publish)
        default: '3869118,5904763,5904743'
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate and independently review test stories
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MATCH_IDS: ${{ inputs.match_id }}
        run: node scripts/check_ai_service.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ai-quality-check
          path: /tmp/ai-quality-check-*.json
