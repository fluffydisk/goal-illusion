[project]
name = "goal-illusion"
version = "0.1.0"
description = "Skorun arkasındaki şut kalitesini keşfet."
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.50,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
