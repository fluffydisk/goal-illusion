name: Publish Goal Illusion
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install application and validation dependencies
        run: |
          pip install uv
          uv sync --locked
      - name: Validate application before publishing
        run: |
          uv run python -m pytest -q
          uv run ruff check .
          uv run python scripts/build_analysis_bundle.py
          node --test tests/*.test.mjs service/*.test.mjs
      - uses: actions/cache@v4
        with:
          path: web/data/matches.json
          key: matches-${{ github.run_id }}
          restore-keys: matches-
      - name: Refresh completed matches
        run: uv run python scripts/export_pages.py
      - uses: actions/cache@v4
        with:
          path: web/data/stories.json
          key: stories-v9-story2-${{ github.run_id }}
          restore-keys: stories-v9-story2-
      - name: Refresh evidence and preserve existing analyses
        run: uv run python scripts/generate_stories.py --provider groq --evidence-only
      - name: Bind match inputs and AI evidence in one snapshot
        run: uv run python scripts/build_analysis_bundle.py
      - name: Fingerprint offline app and data
        run: uv run python scripts/build_service_worker.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
