name: Publish Goal Illusion
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - uses: actions/cache@v4
        with:
          path: web/data/matches.json
          key: matches-${{ github.run_id }}
          restore-keys: matches-
      - name: Refresh completed matches
        run: python scripts/export_pages.py
      - uses: actions/cache@v4
        with:
          path: web/data/stories.json
          key: stories-v7b-published-${{ github.run_id }}
          restore-keys: stories-v7b-published-
      - name: Refresh evidence and preserve existing analyses
        run: python scripts/generate_stories.py --provider groq --evidence-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
